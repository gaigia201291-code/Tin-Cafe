<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7b3f00"><link rel="manifest" href="manifest.json"><title>Tin Cafe</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f7f3ef;color:#2b211b}header{background:#7b3f00;color:#fff;padding:15px;position:sticky;top:0;z-index:5}h1{margin:0}nav{display:flex;gap:6px;overflow:auto;padding:8px;background:#fff;position:sticky;top:60px;z-index:4}nav button{border:0;border-radius:18px;padding:9px 12px;font-weight:700}nav .on,button{background:#7b3f00;color:white}main{padding:12px;max-width:700px;margin:auto}.page{display:none}.page.on{display:block}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.danger{background:#b42318}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#faf7f4;padding:12px;border-radius:10px}.stat b{display:block;font-size:20px}.plus{width:42px;height:42px;border-radius:50%;font-size:23px;padding:0}.muted{color:#777;font-size:13px}.total{font-size:21px;font-weight:800}
</style></head><body>
<header><h1>☕ Tin Cafe</h1></header><nav id="nav"></nav><main>
<section id="order" class="page on"><div class="card"><h2>Order</h2><div id="menuOrder"></div><div class="row"><b>Tạm tính</b><b class="total" id="total">0 đ</b></div><button id="chot">Chốt order</button></div><div class="card"><h3>Order hôm nay</h3><div id="orders"></div></div></section>
<section id="stats" class="page"><div class="card"><h2>Thống kê</h2><label>Ngày<input id="sd" type="date"></label><div class="grid" id="day"></div><br><label>Tháng<input id="sm" type="month"></label><div class="grid" id="month"></div></div></section>
<section id="menu" class="page"><div class="card"><h2>Menu & giá vốn</h2><div class="grid"><label>Tên món<input id="mn"></label><label>Giá bán<input id="mp" type="number"></label><label>Giá vốn<input id="mc" type="number"></label></div><br><button id="addm">Thêm món</button></div><div class="card" id="ml"></div></section>
<section id="finance" class="page"><div class="card"><h2>Tiền mặt & Bank theo ngày</h2><div class="grid"><label>Ngày<input id="bd" type="date"></label><label>Tiền mặt<input id="cash" type="number"></label><label>Bank<input id="bank" type="number"></label></div><br><button id="saveb">Lưu số dư</button></div>
<div class="card"><h2>Chi phí vận hành</h2><div class="grid"><label>Ngày<input id="ed" type="date"></label><label>Số tiền<input id="ea" type="number"></label></div><label>Ghi chú<input id="en"></label><br><button id="adde">Thêm</button><div id="el"></div></div>
<div class="card"><h2>Chi phí mở quầy</h2><div class="grid"><label>Khoản chi<input id="on"></label><label>Số tiền<input id="oa" type="number"></label></div><br><button id="addo">Thêm</button><div id="ol"></div></div></section>
<section id="data" class="page"><div class="card"><h2>Thêm doanh thu / order theo ngày</h2><div class="grid"><label>Ngày<input id="od" type="date"></label><label>Số order<input id="oo" type="number"></label><label>Doanh thu<input id="or" type="number"></label><label>Giá vốn<input id="oc" type="number"></label></div><br><button id="addold">Lưu</button></div>
<div class="card"><h2>Sao lưu & khôi phục</h2><button id="backup">Tải sao lưu</button> <label style="display:inline-block;background:#7b3f00;color:#fff;padding:10px;border-radius:9px">Khôi phục<input id="restore" type="file" accept=".json" style="display:none"></label></div></section>
</main>
<script>
const K='tinCafeData_v2',today=()=>new Date().toISOString().slice(0,10),M=n=>(+n||0).toLocaleString('vi-VN')+' đ';let d=JSON.parse(localStorage.getItem(K)||'null')||{menu:[{id:1,name:'Cà phê đen',price:20000,cost:7000},{id:2,name:'Cà phê sữa',price:25000,cost:9000}],orders:[],expenses:[],opening:[],balances:{},manual:{}};let cart={};const save=()=>localStorage.setItem(K,JSON.stringify(d));const $=x=>document.getElementById(x);
['order','stats','menu','finance','data'].forEach((x,i)=>{let b=document.createElement('button');b.textContent=['Order','Thống kê','Menu & giá vốn','Tài chính','Dữ liệu'][i];b.onclick=()=>show(x);$('nav').append(b)});
function show(x){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(x).classList.add('on');render()}
function render(){
$('menuOrder').innerHTML=d.menu.map(m=>`<div class="row"><span><b>${m.name}</b><br>${M(m.price)}</span><button class="plus" onclick="add(${m.id})">+</button></div>`).join('');
let t=0;for(let id in cart){let m=d.menu.find(x=>x.id==id);if(m)t+=m.price*cart[id]}$('total').textContent=M(t);
$('orders').innerHTML=d.orders.filter(o=>o.date==today()).slice().reverse().map(o=>`<div class="row"><span>${M(o.revenue)}<br><small>${o.items.map(x=>x.name+' × '+x.qty).join(', ')}</small></span><button class="danger" onclick="delOrder('${o.id}')">Xóa</button></div>`).join('')||'<span class="muted">Chưa có order</span>';
$('ml').innerHTML=d.menu.map(m=>`<div class="row"><span><b>${m.name}</b><br>Giá ${M(m.price)} · Vốn ${M(m.cost)}</span><button class="danger" onclick="delMenu(${m.id})">Xóa</button></div>`).join('');
let day=$('sd').value||today(),mon=$('sm').value||day.slice(0,7);$('sd').value=day;$('sm').value=mon;$('bd').value=day;$('ed').value=day;$('od').value=day;
let a=calc(d.orders.filter(o=>o.date==day)),b=calc(d.orders.filter(o=>o.date.startsWith(mon)));let de=d.expenses.filter(x=>x.date==day).reduce((s,x)=>s+x.amount,0),me=d.expenses.filter(x=>x.date.startsWith(mon)).reduce((s,x)=>s+x.amount,0);let md=d.manual[day]||{};a.orders+=(+md.orders||0);a.rev+=(+md.rev||0);a.cost+=(+md.cost||0);Object.values(d.manual).filter(x=>x.month==mon).forEach(x=>{b.orders+=+x.orders||0;b.rev+=+x.rev||0;b.cost+=+x.cost||0});$('day').innerHTML=cards(a,de);$('month').innerHTML=cards(b,me);
$('cash').value=d.balances[day]?.cash??'';$('bank').value=d.balances[day]?.bank??'';$('el').innerHTML=d.expenses.filter(x=>x.date==day).map((x,i)=>`<div class=row>${M(x.amount)} ${x.note||''}<button class=danger onclick="d.expenses.splice(${d.expenses.indexOf(x)},1);save();render()">Xóa</button></div>`).join('');$('ol').innerHTML=d.opening.map((x,i)=>`<div class=row>${x.name}: ${M(x.amount)}<button class=danger onclick="d.opening.splice(${i},1);save();render()">Xóa</button></div>`).join('');
}
function calc(a){return{orders:a.length,rev:a.reduce((s,x)=>s+x.revenue,0),cost:a.reduce((s,x)=>s+x.cost,0)}}function cards(a,e){return`<div class=stat>Order<b>${a.orders}</b></div><div class=stat>Doanh thu<b>${M(a.rev)}</b></div><div class=stat>Giá vốn<b>${M(a.cost)}</b></div><div class=stat>Chi phí<b>${M(e)}</b></div><div class=stat>Lợi nhuận<b>${M(a.rev-a.cost-e)}</b></div>`}
function add(id){cart[id]=(cart[id]||0)+1;render()}function delOrder(id){if(confirm('Xóa order?')){d.orders=d.orders.filter(o=>o.id!=id);save();render()}}function delMenu(id){if(confirm('Xóa món?')){d.menu=d.menu.filter(m=>m.id!=id);delete cart[id];save();render()}}
$('chot').onclick=()=>{let items=Object.entries(cart).map(([id,q])=>{let m=d.menu.find(x=>x.id==id);return m&&{name:m.name,qty:q,price:m.price,cost:m.cost}}).filter(Boolean);if(!items.length)return alert('Chưa chọn món');d.orders.push({id:String(Date.now()),date:today(),items,revenue:items.reduce((s,x)=>s+x.price*x.qty,0),cost:items.reduce((s,x)=>s+x.cost*x.qty,0)});cart={};save();render()};
$('addm').onclick=()=>{if(!$('mn').value)return;d.menu.push({id:Date.now(),name:$('mn').value,price:+$('mp').value||0,cost:+$('mc').value||0});save();render()};
$('saveb').onclick=()=>{d.balances[$('bd').value]={cash:+$('cash').value||0,bank:+$('bank').value||0};save();alert('Đã lưu số dư ngày')};
$('adde').onclick=()=>{d.expenses.push({date:$('ed').value,amount:+$('ea').value||0,note:$('en').value});save();render()};
$('addo').onclick=()=>{d.opening.push({name:$('on').value,amount:+$('oa').value||0});save();render()};
$('addold').onclick=()=>{let x=$('od').value;d.manual[x]={orders:+$('oo').value||0,rev:+$('or').value||0,cost:+$('oc').value||0,month:x.slice(0,7)};save();alert('Đã lưu');render()};
$('sd').onchange=render;$('sm').onchange=render;
$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='tin-cafe-backup-'+today()+'.json';a.click()};
$('restore').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.menu||!x.orders)throw Error('File không đúng định dạng');d=x;save();render();alert('Khôi phục thành công')}catch(err){alert('Không thể khôi phục: '+err.message)}};r.readAsText(e.target.files[0])};save();render();
</script></body></html>
